<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título de la pestaña del navegador -->
  <title>{{ page.title | default: "Caribe Royal Petrol C.A. | Construcción y Servicios Petroleros" }}</title>
  
  <!-- Favicon Vectorial (.SVG) -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo-icon.svg' | relative_url }}">
  
  <!-- Fuente Poppins vía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Script para menu hamburguesa -->
  <script>
  const menuBtn = document.getElementById('mobileMenuBtn');
  const navMenu = document.querySelector('.header-container nav');

  if (menuBtn && navMenu) {
    menuBtn.addEventListener('click', () => {
      menuBtn.classList.toggle('is-active');
      navMenu.classList.toggle('nav-active');
    });
  }
</script>
</body>
</html>
